version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements/demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      demo-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      official-actions:
        patterns: ['actions/*']
