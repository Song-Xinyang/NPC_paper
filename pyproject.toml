[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npcpaper"
version = "0.1.0"
description = "Reproducible code for NPC dual-virus MRI prognostic modeling and scRNA-seq analyses"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["npcpaper*"]
